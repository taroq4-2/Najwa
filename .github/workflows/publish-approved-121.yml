name: Publish approved Najwa 1.2.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-approved-121.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-approved-najwa-121
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify accepted build and publish existing draft
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/runs/43714631289 > accepted-run.json
          python3 - <<'PY'
          import json
          r=json.load(open('accepted-run.json'))
          assert r['head_sha']=='0fe16c6a8ba78eb9690a604ccec40d5f09665151'
          assert r['conclusion']=='success'
          PY
          gh release download v1.2.1 --pattern Najwa.apk
          echo '33696188139c6e22cff627a1e3720b70988d40c432c927ccc595f5cf358eff7e  Najwa.apk' | sha256sum -c -
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          python3 scripts/verify_release_apk.py Najwa.apk --build-tools "$ANDROID_HOME/build-tools/35.0.0" --version-name 1.2.1 --version-code 111 --expected-sha256 33696188139c6e22cff627a1e3720b70988d40c432c927ccc595f5cf358eff7e
          gh release edit v1.2.1 --draft=false --latest
          curl --fail --location --retry 4 --retry-delay 5 https://github.com/taroq4-2/Najwa/releases/latest/download/Najwa.apk -o published.apk
          echo '33696188139c6e22cff627a1e3720b70988d40c432c927ccc595f5cf358eff7e  published.apk' | sha256sum -c -
