name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - run: sh gradlew --no-daemon -PplatformTests=true :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintRelease
        env:
          NAJWA_ROBOLECTRIC_REPO: https://maven-central.storage-download.googleapis.com/maven2
      - run: python3 scripts/audit_privacy.py --require-release-merged
      - run: sh gradlew :app:dependencies --configuration releaseRuntimeClasspath > dependency-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verification-evidence
          path: |
            core/build/reports/tests/
            app/build/reports/
            app/build/outputs/apk/debug/
            dependency-tree.txt

  preview:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install the preview SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - run: sh gradlew --no-daemon -PpreviewSdk=35 :app:testDebugUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-preview-evidence
          path: app/build/reports/
