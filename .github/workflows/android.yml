name: Android verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - run: sh gradlew --no-daemon -PplatformTests=true :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintRelease
      - run: python3 scripts/audit_privacy.py --require-merged
      - run: sh gradlew :app:dependencies --configuration debugRuntimeClasspath > dependency-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            core/build/reports/tests/
            app/build/reports/
            app/build/outputs/apk/debug/
            dependency-tree.txt
      # No signing, publishing, or false claim of device/visual acceptance.
