name: iOS verification
on:
  push:
    paths: ['ios/**', 'core/src/main/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'core/src/main/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          # Newest stable Xcode (26 has the iOS 26 SDK for scheduled Live Activities); fall back to 16.
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: NajwaCore tests (matches the Android core to the second)
        run: swift test --package-path ios/NajwaCore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build app and widget for the simulator (unsigned)
        run: |
          cd ios
          xcodebuild build -project Najwa.xcodeproj -scheme Najwa \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build.log | grep -E "error:|warning: .*(Najwa|NajwaWidget)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Screenshots on the iPhone simulator
        run: |
          cd ios
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith(('iPhone 17 Pro','iPhone 16 Pro'))))")
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Najwa.app
          mkdir -p shots
          shot() { # name, appearance, language, extra launch args...
            local name=$1 look=$2 lang=$3; shift 3
            xcrun simctl ui "$DEVICE" appearance "$look"
            xcrun simctl terminate "$DEVICE" org.najwa.app || true
            xcrun simctl launch "$DEVICE" org.najwa.app -AppleLanguages "($lang)" -AppleLocale "$lang" "$@"
            sleep 6; xcrun simctl io "$DEVICE" screenshot "shots/$name.png"
          }
          shot setup-ar dark ar
          shot home-ar-dark dark ar -NajwaDemo
          shot home-ar-light light ar -NajwaDemo
          shot settings-ar dark ar -NajwaDemo -NajwaTab settings
          shot home-en-dark dark en -NajwaDemo
          shot settings-en light en -NajwaDemo -NajwaTab settings
          shot home-ur dark ur -NajwaDemo
          shot home-tr light tr -NajwaDemo
          shot settings-id light id -NajwaDemo -NajwaTab settings
          shot widgets-ar dark ar -NajwaDemo -NajwaWidgets
          shot widgets-en dark en -NajwaDemo -NajwaWidgets
          shot live-ar dark ar -NajwaDemo -NajwaLive
          shot live-en dark en -NajwaDemo -NajwaLive
          # A real Live Activity, then another app in front so the Dynamic Island shows it.
          xcrun simctl terminate "$DEVICE" org.najwa.app || true
          xcrun simctl launch --stdout="$PWD/shots/live.log" --stderr="$PWD/shots/live.log" "$DEVICE" org.najwa.app -AppleLanguages "(ar)" -AppleLocale ar -NajwaDemo -NajwaLiveStart
          sleep 8; cat shots/live.log || true
          xcrun simctl launch "$DEVICE" com.apple.Preferences
          sleep 5; xcrun simctl io "$DEVICE" screenshot shots/island-ar.png
      - name: Unsigned device IPA (testers sign it with their own Apple ID)
        run: |
          cd ios
          xcodebuild build -project Najwa.xcodeproj -scheme Najwa -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device.log
          APP=device/Build/Products/Release-iphoneos/Najwa.app
          test -d "$APP/PlugIns/NajwaWidget.appex"
          mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Najwa-iOS.ipa Payload)
          ls -l Najwa-iOS.ipa && shasum -a 256 Najwa-iOS.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: najwa-ios-ipa
          path: ios/Najwa-iOS.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-screenshots
          path: |
            ios/shots/
            ios/build.log
